<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='projetocassino.css') }}">

    <title>Cassino</title>
</head>

<body>

    <header class="cabecalho">
        <h1>CASSINO</h1>

        <div class="divida">
            <h2>Tempo restante: <span id="timer">450</span>s</h2>

            <h2>Dívida: R$ <span id="divida">11000000000000</span></h2>

            <button id="pagar_divida">Pagar dívida</button>

            <h3 id="estado">
                Pague a dívida do Brasil antes que as bets acabem!
            </h3>
        </div>
    </header>

    <main class="layout">

        <!-- ESTATÍSTICAS -->
        <aside class="estatisticas">
            <h2>Estatísticas</h2>

            <p>Saldo: <span id="saldo">1000</span></p>
            <p>Giros: <span id="giros_totais">0</span></p>
            <p>Vitórias: <span id="numero">0</span></p>
            <p>Multiplicador: <span id="custo_giro">1</span></p>
            <p>Ganho por giro: <span id="ganho_giro">1000</span></p>
        </aside>

        <!-- JOGO CENTRAL -->
        <section class="jogo">

            <h1 id="resultado">Boa sorte!</h1>

            <div class="imagens" id="imagens">
                <img src="{{ url_for('static', filename='alex.png') }}" id="imagem1">
                <img src="{{ url_for('static', filename='alex.png') }}" id="imagem2">
                <img src="{{ url_for('static', filename='alex.png') }}" id="imagem3">
            </div>

            <button id="girar_roleta" class="botao-clique_em_mim">
                GIRAR
            </button>

            <div class="valor">
                <label for="aposta">Valor da aposta:</label>

                <input type="number" id="aposta" value="10" min="1">
            </div>

        </section>

        <!-- MELHORIAS -->
        <aside class="painel-melhorias">

            <h2>Melhorias</h2>

            <div class="melhoria-item">
                <button class="melhorias" id="botao_melhoria2">
                    Melhorar recompensa
                </button>

                <h3 id="custo_melhoria2">200</h3>
            </div>

            <div class="melhoria-item">
                <button class="melhorias" id="botao_melhoria1">
                    Velocidade do giro
                </button>

                <h3 id="custo_melhoria1">200</h3>
            </div>

        </aside>

    </main>

    <script src="{{ url_for('static', filename='projetocassino.js') }}"></script>

</body>
</html>
